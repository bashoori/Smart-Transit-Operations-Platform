x-airflow-common: &airflow-common
  image: apache/airflow:2.9.0-python3.11
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    TRANSLINK_API_KEY: ${TRANSLINK_API_KEY}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    WEATHER_API_URL: ${WEATHER_API_URL}
    WEATHER_LATITUDE: ${WEATHER_LATITUDE}
    WEATHER_LONGITUDE: ${WEATHER_LONGITUDE}
    DATA_ROOT: /opt/airflow/data
    BRONZE_PATH: /opt/airflow/data/bronze
    SILVER_PATH: /opt/airflow/data/silver
    GOLD_PATH: /opt/airflow/data/gold
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./ingestion:/opt/airflow/ingestion
    - ./transformations:/opt/airflow/transformations
    - ./sql:/opt/airflow/sql
    - airflow_logs:/opt/airflow/logs
    - data_volume:/opt/airflow/data
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - translink_net

services:

  postgres:
    image: postgres:16-alpine
    container_name: translink_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/ddl/init_databases.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - translink_net
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: translink_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Bita \
          --lastname Ashoori \
          --role Admin \
          --email admin@translink.local
        echo "Airflow initialised"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: translink_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: translink_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8.6
    container_name: translink_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@translink.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - translink_net
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  airflow_logs:
  data_volume:

networks:
  translink_net:
    driver: bridge
